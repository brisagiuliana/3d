<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papiweb - Image to 3D Converter</title>
    <link rel="icon" type="image/png" href="assets/scripts/faviconPapiweb3d.png">

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@latest/dist/tf-backend-webgl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.8/dist/tf-tflite.min.js"></script>

    <!-- Import Map for three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
        }
    }
    </script>

    <style>
        :root {
            --primary-color: #1a237e;
            --secondary-color: #0d47a1;
            --accent-color: #2196f3;
            --text-light: #ffffff;
            --text-dark: #333333;
            --gradient-bg: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--gradient-bg);
            color: var(--text-dark);
            min-height: 100vh;
        }

        header {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
            color: var(--text-light);
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        main {
            padding: 2rem;
            max-width: 1000px;
            margin: auto;
        }

        #controls-card, #output-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 2rem;
            transition: transform 0.3s ease;
        }

        #controls-card:hover, #output-card:hover {
            transform: translateY(-5px);
        }

        #controls-card p {
            margin-top: 0;
            color: var(--text-dark);
            line-height: 1.6;
        }

        #generate-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
        }

        #generate-btn:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4);
        }

        #generate-btn:active {
            transform: translateY(0);
        }

        #output-card {
            text-align: center;
            overflow: hidden;
        }
        #loading-indicator {
            padding: 2rem;
            font-size: 1.2rem;
            color: var(--secondary-color);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            margin: 1rem 0;
        }

        input[type="file"] {
            background: rgba(255, 255, 255, 0.9);
            padding: 1rem;
            border-radius: 8px;
            border: 2px dashed var(--accent-color);
            width: 100%;
            box-sizing: border-box;
            margin: 1rem 0;
            cursor: pointer;
        }

        input[type="checkbox"] {
            accent-color: var(--accent-color);
            width: 1.2rem;
            height: 1.2rem;
            margin-right: 0.5rem;
        }

        label {
            font-weight: 500;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            display: inline-block;
        }

        h2 {
            color: var(--secondary-color);
            margin-top: 0;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        #renderer-canvas {
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Papiweb desarrollos informáticos</h1>
    </header>
    <main>
        <div id="controls-card">
            <h2>1. Configure & Upload</h2>
            <p>Select an image and choose your generation settings.</p>
            <div>
                <label for="image-upload">Image File:</label>
                <input type="file" id="image-upload" accept="image/jpeg, image/png">
            </div>
            <div style="margin-top: 1rem; border-top: 1px solid #eee; padding-top: 1rem;">
                <input type="checkbox" id="use-normal-map" name="use-normal-map" checked>
                <label for="use-normal-map">Enable Advanced Textures (Normal Map)</label>
                <p style="font-size: 0.8rem; color: #666;">Adds more realistic surface detail to the model. Requires slightly more processing time.</p>
            </div>
        </div>

        <div id="output-card">
            <h2>2. Generate & View</h2>
            <button id="generate-btn">Generate 3D Model</button>
            <div id="loading-indicator" style="display:none;">
                <p>⚙️ Generating model, this may take a minute...</p>
            </div>
            <canvas id="renderer-canvas" style="display:none; width: 100%; height: 500px;"></canvas>
        </div>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
