<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papiweb - Image to 3D Converter</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@latest/dist/tf-backend-webgl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.8/dist/tf-tflite.min.js"></script>

    <!-- Import Map for three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
        }
    }
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #fff;
            padding: 1rem 2rem;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #444;
        }
        main {
            padding: 2rem;
            max-width: 900px;
            margin: auto;
        }
        #controls-card {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        #controls-card p {
            margin-top: 0;
        }
        #generate-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #generate-btn:hover, #download-btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 86, 179, 0.4);
        }
        
        #download-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: 1rem;
        }
        
        #download-btn:hover {
            background-color: #218838;
        }

        #output-card {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        #loading-indicator {
            padding: 2rem;
            font-size: 1.2rem;
            color: #555;
        }
        model-viewer {
            width: 100%;
            height: 500px;
            border-radius: 8px;
            background-color: #eee;
        }
    </style>
</head>
<body>
    <header>
        <h1>Papiweb desarrollos informáticos</h1>
    </header>
    <main>
        <div id="controls-card">
            <h2>1. Configure & Upload</h2>
            <p>Select an image and choose your generation settings.</p>
            <div>
                <label for="image-upload">Image File:</label>
                <input type="file" id="image-upload" accept="image/jpeg, image/png">
            </div>
            <div style="margin-top: 1rem; border-top: 1px solid #eee; padding-top: 1rem;">
                <input type="checkbox" id="use-normal-map" name="use-normal-map" checked>
                <label for="use-normal-map">Enable Advanced Textures (Normal Map)</label>
                <p style="font-size: 0.8rem; color: #666;">Adds more realistic surface detail to the model. Requires slightly more processing time.</p>
            </div>
        </div>

        <div id="output-card">
            <h2>2. Generate & View</h2>
            <button id="generate-btn">Generate 3D Model</button>
            <button id="download-btn" style="display:none;">
                <span>📥 Download 3D Model (GLB)</span>
            </button>
            <div id="loading-indicator" style="display:none;">
                <p>⚙️ Generating model, this may take a minute...</p>
            </div>
            <canvas id="renderer-canvas" style="display:none; width: 100%; height: 500px;"></canvas>
        </div>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
