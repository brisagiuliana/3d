<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papiweb - Image to 3D Converter</title>

    <!-- Import the <model-viewer> component -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script nomodule src="https://unpkg.com/@google/model-viewer/dist/model-viewer-legacy.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #fff;
            padding: 1rem 2rem;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #444;
        }
        main {
            padding: 2rem;
            max-width: 900px;
            margin: auto;
        }
        #controls-card {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        #controls-card p {
            margin-top: 0;
        }
        #generate-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #generate-btn:hover {
            background-color: #0056b3;
        }
        #output-card {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        #loading-indicator {
            padding: 2rem;
            font-size: 1.2rem;
            color: #555;
        }
        model-viewer {
            width: 100%;
            height: 500px;
            border-radius: 8px;
            background-color: #eee;
        }
    </style>
</head>
<body>
    <header>
        <h1>Papiweb desarrollos informáticos</h1>
    </header>
    <main>
        <div id="controls-card">
            <h2>1. Configure & Upload</h2>
            <p>Select an image and choose your generation settings.</p>
            <div>
                <label for="image-upload">Image File:</label>
                <input type="file" id="image-upload" accept="image/jpeg, image/png">
            </div>
            <div style="margin-top: 1rem; border-top: 1px solid #eee; padding-top: 1rem;">
                <input type="checkbox" id="use-normal-map" name="use-normal-map" checked>
                <label for="use-normal-map">Enable Advanced Textures (Normal Map)</label>
                <p style="font-size: 0.8rem; color: #666;">Adds more realistic surface detail to the model. Requires slightly more processing time.</p>
            </div>
        </div>

        <div id="output-card">
            <h2>2. Generate & View</h2>
            <button id="generate-btn">Generate 3D Model</button>
            <div id="loading-indicator" style="display:none;">
                <p>⚙️ Generating model, this may take a minute...</p>
            </div>
            <model-viewer id="viewer"
                          src=""
                          alt="3D model preview will appear here"
                          ar
                          camera-controls
                          auto-rotate
                          style="display:none;">
            </model-viewer>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const uploadInput = document.getElementById('image-upload');
            const generateBtn = document.getElementById('generate-btn');
            const loadingIndicator = document.getElementById('loading-indicator');
            const viewer = document.getElementById('viewer');

            generateBtn.addEventListener('click', async () => {
                const file = uploadInput.files[0];
                if (!file) {
                    alert('Please select an image file first.');
                    return;
                }

                // Show loading indicator and hide viewer
                loadingIndicator.style.display = 'block';
                viewer.style.display = 'none';
                viewer.src = ""; // Clear previous model

                const formData = new FormData();
                formData.append('file', file);

                const useNormalMap = document.getElementById('use-normal-map').checked;
                formData.append('use_normal_map', useNormalMap);

                try {
                    const response = await fetch('/generate', {
                        method: 'POST',
                        body: formData,
                    });

                    const result = await response.json();

                    if (result.success) {
                        // Preload the model and then show the viewer
                        viewer.addEventListener('load', () => {
                            loadingIndicator.style.display = 'none';
                            viewer.style.display = 'block';
                        }, { once: true });

                        viewer.src = result.model_url;
                    } else {
                        alert(`Error: ${result.error}`);
                        loadingIndicator.style.display = 'none';
                    }
                } catch (error) {
                    console.error('An error occurred:', error);
                    alert('An unexpected error occurred. Please check the server logs.');
                    loadingIndicator.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
